title: Monitored Authentication Log Modified
id: 7b2e4d16-9c83-4f57-b0a2-5e8c1a3f9d42
status: experimental
description: >
  Detects modification or truncation of a monitored authentication log through
  a dedicated Auditd watch tagged with the log_tamper key. The detection is
  mapped to MITRE ATT&CK T1070.002 and corresponds to Wazuh rule 100023.
  Resource scoping is performed at the sensor rather than in the detection
  rule because the affected file path was not available as a decoded field
  in the evaluated Wazuh configuration.
author: Jeffrey Ofuje Adegoke
date: 2026/08/24

references:
  - https://attack.mitre.org/techniques/T1070/002/

logsource:
  product: linux
  service: auditd

detection:
  selection:
    type: 'SYSCALL'
    key: 'log_tamper'
  condition: selection

falsepositives:
  - Scheduled or manual log rotation
  - Administrative log maintenance

level: high

tags:
  - attack.defense_evasion
  - attack.t1070.002
